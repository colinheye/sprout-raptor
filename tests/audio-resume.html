<!doctype html>
<html><head><meta charset="utf-8"><title>audio resume</title>
<style>body{font:12px ui-monospace,monospace;background:#111;color:#8f8;margin:0}iframe{width:880px;height:400px;border:0}</style>
</head><body>
<iframe id="f"></iframe><pre id="out">pending</pre>
<script>
// Reproduces the reported bug: the context starts suspended (what iOS does when
// it isn't convinced the gesture was real) and must come back on a plain click.
var f = document.getElementById('f'), out = document.getElementById('out');
f.src = '../index.html?dev=1&cb=' + Date.now();
var R = {};

function run() {
  var w = f.contentWindow;
  if (!w || !w.__SR) { setTimeout(run, 100); return; }
  var S = w.__SR, g = S.game;
  S.startGame();
  g.invincible = true;

  var ac = S.ctx();
  R.hasContext = !!ac;
  if (!ac) { out.textContent = JSON.stringify(R); return; }
  R.stateAfterStart = ac.state;

  // simulate iOS holding the context suspended
  ac.suspend().then(function () {
    R.stateAfterSuspend = ac.state;

    // a synthetic event can't *grant* user activation, so assert the wiring:
    // does a plain tap cause resume() to be attempted at all?
    var AC = w.AudioContext || w.webkitAudioContext;
    var resumes = 0, origR = AC.prototype.resume;
    AC.prototype.resume = function () { resumes++; return origR.apply(this, arguments); };

    var el = w.document.getElementById('game');
    var opt = { bubbles: true, cancelable: true, pointerId: 1, pointerType: 'touch', isPrimary: true };
    el.dispatchEvent(new PointerEvent('pointerup', opt));

    setTimeout(function () {
      R.resumeCallsFromPointerup = resumes;
      var before = resumes;
      el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
      setTimeout(function () {
        R.resumeCallsFromClick = resumes - before;
        R.stateAfter = ac.state;
        R.err = S.info().err;
        out.textContent = JSON.stringify(R, null, 1);
      }, 300);
    }, 200);
  });
}
f.addEventListener('load', function () { setTimeout(run, 250); });
</script>
</body></html>
